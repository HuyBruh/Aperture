name: Release Aperture
on:
  push:
    tags: ['v4.*.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/generate-design.py --check
      - run: python tools/check-design.py
      - run: cargo check --locked --bins
      - run: cargo test --release --locked --bins --lib -- --test-threads=1
      - run: cargo build --release --locked --bin aperture-display --bin aperture
      - run: python tools/render-collection.py
      - run: ./tools/package.ps1
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Aperture 4.0
          body_path: docs/RELEASE.md
          files: |
            dist/aperture-windows.zip
            dist/SHA256SUMS.txt
