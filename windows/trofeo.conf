# Aperture — a quieter view of your system.
# Open Aperture.exe to change these settings. Changes apply in about a second.
# Keep your existing trofeo.conf when upgrading; this file is only a clean default.

# Display
layout = pro
orientation = landscape
flip = false
brightness = 100
language = en
studio_language = en

# New: board, studio, pulse, cluster
# Aperture: panorama, cinema, axis, ledger, duet, orbit, atelier
# Signature: focus, grid, stack, mosaic, mixer, chart, player, tint, glass, gauge, swiss
# Classic: classic, cockpit, bento, terminal, chamfer, rings, dots
# Portrait: lock, equalizer, receipt, synthwave, blueprint
# "all" rotates New + Aperture + Focus + Grid; a comma list makes your own rotation.
pro_layout = board
# Palettes: mineral, frost, blush, sand, iris, lagoon, nzxt, graphite, crimson,
# arctic, ember, neon, all, or #RRGGBB
pro_theme = mineral
pro_style = flat
pro_rotate = cw
pro_theme_interval = 30
pro_cover_color = false
pro_song_popup = false
pro_clock = 24h
# pro_fan_sensor = CPU Fan        (a fan header or an AIO pump; see Sensors in the app)
# pro_game_layout = duet
# pro_night = 22:00-07:00
# pro_night_dim = 40
# pro_night_theme = mineral
# pro_alert_cpu = 90
# pro_alert_gpu = 90

# Stable dashboard in games; FPS and VRAM have separate positions.
hide = dashboard
music_screen = false
layout_spectrum = false
pixel_game = false

# Units
percent_decimals = 0
mem_unit = gb
net_unit = auto
weather_unit = c
# Empty location uses IP-based detection. A fixed city requires a restart.
# weather_city = City, Country

# Sensors [restart]
fps_monitor = true
# Programs never shown as the game (browsers, launchers, Discord are built in)
# fps_ignore = obs64.exe, myapp.exe
deepcool = false
