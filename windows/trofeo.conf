# ==============================================================================
#  TROFEO PRO DASHBOARD - default configuration
#  This file is re-read every second: edit, save, and the display updates
#  (except lines marked [restart]).  Prefer a window?  Open HuyBruh Dash (huybruh_dash.exe).
#  Every available option is documented in trofeo.conf.example / OPTIONS_GUIDE.md.
# ==============================================================================

# --- Display -------------------------------------------------------------------
orientation = landscape
flip = false                      # true if the panel is mounted upside-down
language = en
brightness = 100                  # 0-100

# --- Main screen: the "pro" dashboard -------------------------------------------
layout = pro

#   pro_layout : focus studio grid line split meter glance daylight swiss
#                classic cockpit bento terminal chamfer rings dots                     (landscape)
#                lock | equalizer | receipt | synthwave | blueprint                     (portrait)
#                all = cycle all landscape layouts, portrait = cycle the portrait ones;
#                several names separated by commas = your own rotation
#   pro_theme  : nzxt | graphite | crimson | arctic | ember | neon | all | #RRGGBB (your own color)
#   pro_style  : cards | glass | flat      (classic / cockpit / focus only)
#   pro_rotate : cw | ccw                  (portrait layouts only; flip if the picture is upside-down)
#   pro_theme_interval : minutes per theme when cycling (0 = first theme only)
pro_layout = focus
pro_theme = nzxt
pro_style = cards
pro_rotate = cw
pro_theme_interval = 30
pro_cover_color = false           # while music plays, accent colors follow the album art
pro_song_popup = true             # on song change: show a cover + title card for ~3 s
# pro_clock = 24h                 # 24h | 12h (shows AM / PM)
# pro_game_layout = focus         # switch to this layout while a game reports FPS (then back)
# pro_game_theme = crimson        # ...and optionally this theme
# pro_night = 22:00-07:00         # night schedule: dims the screen and (optionally) changes theme
# pro_night_dim = 40              # brightness at night, percent (10-100)
# pro_night_theme = graphite
# pro_fan_sensor =                # which fan (HWiNFO / LibreHardwareMonitor label) is the CPU fan; empty = automatic
# pro_alert_cpu = 85              # flash a red frame + pill when the CPU gets this hot (degrees C), 0 = off
# pro_alert_gpu = 85
hide = dashboard                  # keep this dashboard while gaming (FPS is already part of it)
music_screen = false
layout_spectrum = false
pixel_game = false

# --- Units -----------------------------------------------------------------------
percent_decimals = 0
mem_unit = gb
net_unit = auto

# --- Weather -----------------------------------------------------------------------
# By default the location is detected from your public IP address.
# weather_city = London, England   # [restart] "City, Region/Country" or coordinates "51.5, -0.12"
weather_unit = c                   # c | f

# --- Integrations --------------------------------------------------------------------
fps_monitor = true                # [restart] in-game FPS for DirectX 9-12 (needs Administrator - autostart handles it)
deepcool = false                  # [restart]
